[package]
name = "odo-gui"
version = "0.1.0"
description = "Odo — personal research coding OS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "odo_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
